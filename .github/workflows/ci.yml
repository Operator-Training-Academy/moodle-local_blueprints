name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  php-checks:
    name: PHP checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        run: |
          find . -path './.git' -prune -o -name '*.php' -print0 \
            | xargs -0 -n 1 php -l

      - name: Validate plugin metadata
        run: |
          component="$(sed -n "s/.*\$plugin->component[[:space:]]*=[[:space:]]*'\([^']*\)';.*/\1/p" version.php)"
          if [ "$component" != "local_blueprints" ]; then
            echo "version.php must declare component local_blueprints." >&2
            exit 1
          fi

          version="$(sed -n "s/.*\$plugin->version[[:space:]]*=[[:space:]]*\([0-9][0-9]*\);.*/\1/p" version.php)"
          if [ -z "$version" ]; then
            echo "version.php must declare a numeric plugin version." >&2
            exit 1
          fi

          if [ ! -f lang/en/local_blueprints.php ]; then
            echo "Missing English language file." >&2
            exit 1
          fi

          echo "local_blueprints version ${version} metadata looks good."
